<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invenlux — Prototipo Sprint 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEEC;
  --surface:#FFFFFF;
  --surface-2:#F5F8F7;
  --ink:#0F1F1B;
  --ink-soft:#5F716C;
  --ink-faint:#93A29E;
  --line:#D6DFDC;
  --fresh:#0B7A5C;
  --fresh-soft:#DCEFE7;
  --warn:#B87400;
  --warn-soft:#FBEDD3;
  --urgent:#B33520;
  --urgent-soft:#FADFD9;
  --frost:#2A6FA8;
  --frost-soft:#DCEAF5;
  --radius:14px;
  --shadow:0 1px 2px rgba(15,31,27,.06), 0 8px 24px rgba(15,31,27,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  font-family:'Inter Tight',system-ui,sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;justify-content:center;
  padding:0;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px}
:focus-visible{outline:2px solid var(--fresh);outline-offset:2px;border-radius:6px}

/* ---------- App shell ---------- */
#app{
  width:100%;max-width:430px;background:var(--bg);
  min-height:100vh;display:flex;flex-direction:column;position:relative;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
}
header{
  padding:20px 18px 12px;background:var(--bg);
  position:sticky;top:0;z-index:20;border-bottom:1px solid transparent;
  transition:border-color .2s;
}
header.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:baseline;gap:9px}
.brand h1{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:25px;letter-spacing:-.03em;margin:0;
}
.brand .tag{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  border:1px solid var(--line);padding:2.5px 6px;border-radius:5px;
}
.view-title{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:-.02em;margin:16px 0 2px;
}
.view-sub{font-size:12.5px;color:var(--ink-soft);margin:0}

main{flex:1;padding:0 18px 108px;overflow-y:auto}

/* ---------- Horizonte de caducidad (signature) ---------- */
.horizon{
  background:var(--surface);border-radius:var(--radius);padding:15px 15px 11px;
  margin-top:14px;box-shadow:var(--shadow);
}
.horizon-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.horizon-head span:first-child{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);
}
.horizon-head span:last-child{font-size:11.5px;color:var(--ink-soft)}
.track{position:relative;height:56px;margin:0 2px}
.axis{position:absolute;left:0;right:0;top:26px;height:1px;background:var(--line)}
.tick{position:absolute;top:31px;transform:translateX(-50%);text-align:center}
.tick i{display:block;width:1px;height:5px;background:var(--line);margin:0 auto 4px}
.tick span{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-faint);
  white-space:nowrap;
}
.pip{
  position:absolute;top:26px;width:9px;height:9px;border-radius:50%;
  transform:translate(-50%,-50%);border:2px solid var(--surface);
  animation:pop .4s cubic-bezier(.2,1.3,.4,1) backwards;
}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
.pip.u{background:var(--urgent)}
.pip.w{background:var(--warn)}
.pip.f{background:var(--fresh)}
.horizon-legend{
  display:flex;gap:13px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
}
.horizon-legend div{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-soft)}
.horizon-legend b{width:7px;height:7px;border-radius:50%}

/* ---------- Filtros ---------- */
.filters{display:flex;gap:6px;margin:16px 0 10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:6.5px 12px;border-radius:20px;background:var(--surface);
  border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink-soft);
  transition:.15s;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- Cards ---------- */
.card{
  width:100%;text-align:left;background:var(--surface);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);display:block;
  transition:transform .12s;
}
.card:active{transform:scale(.985)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.p-name{font-weight:600;font-size:15px;letter-spacing:-.01em;margin:0 0 3px}
.p-meta{font-size:11.5px;color:var(--ink-soft);margin:0}
.p-qty{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;
  white-space:nowrap;letter-spacing:-.02em;
}
.p-qty small{font-size:10.5px;font-weight:500;color:var(--ink-soft);margin-left:2px}
.p-foot{display:flex;gap:8px;align-items:center;margin-top:9px;justify-content:space-between}
.p-tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.card-main{cursor:pointer}
.card-x{
  flex:0 0 auto;width:27px;height:27px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1;color:var(--ink-faint);
  background:var(--surface-2);border:1px solid var(--line);
}
.card-x:active{background:var(--urgent-soft);color:var(--urgent);border-color:var(--urgent-soft)}

.badge{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px;
}
.b-u{background:var(--urgent-soft);color:var(--urgent)}
.b-w{background:var(--warn-soft);color:var(--warn)}
.b-f{background:var(--fresh-soft);color:var(--fresh)}
.b-n{background:var(--surface-2);color:var(--ink-soft)}
.loc{
  font-size:10.5px;padding:3px 7px;border-radius:5px;font-weight:500;
  background:var(--surface-2);color:var(--ink-soft);
}
.loc.Congelador{background:var(--frost-soft);color:var(--frost)}

.empty{
  text-align:center;padding:44px 24px;color:var(--ink-soft);
}
.empty p{margin:0 0 4px;font-weight:600;color:var(--ink);font-size:14.5px}
.empty small{font-size:12.5px;line-height:1.5;display:block}

/* ---------- Botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 15px;border-radius:11px;font-size:14px;font-weight:600;
  transition:.15s;width:100%;
}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:active{background:#243d36}
.btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--urgent-soft);color:var(--urgent)}
.btn-row{display:flex;gap:8px}

.fab{
  position:fixed;right:max(18px, calc((100% - 430px) / 2 + 18px));bottom:88px;
  width:52px;height:52px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:26px;line-height:0;z-index:30;
  box-shadow:0 6px 20px rgba(15,31,27,.28);display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(.94)}

/* ---------- Nav ---------- */
nav{
  position:sticky;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding:7px 4px 9px;
}
nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
  font-size:10.5px;font-weight:500;color:var(--ink-faint);position:relative;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.dot{
  position:absolute;top:2px;right:calc(50% - 17px);min-width:15px;height:15px;
  border-radius:9px;background:var(--urgent);color:#fff;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  font-family:'JetBrains Mono',monospace;
}

/* ---------- Sheet / modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(15,31,27,.42);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}}
.sheet{
  width:100%;max-width:430px;background:var(--bg);border-radius:20px 20px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;
  letter-spacing:-.02em;margin:0 0 2px;
}
.sheet .lead{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px}

label{display:block;margin-bottom:12px}
label .lbl em{font-style:normal;color:var(--ink-faint)}
label .lbl{
  display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;
}
input,select{
  width:100%;padding:10.5px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);
}
input:focus,select:focus{outline:none;border-color:var(--fresh);box-shadow:0 0 0 3px var(--fresh-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--urgent);font-size:12px;margin:-6px 0 12px;font-weight:500}
.combo{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  max-height:252px;overflow-y:auto;margin:-6px 0 12px;
}
.opt{
  display:block;width:100%;text-align:left;padding:9px 12px;
  border-bottom:1px solid var(--line);
}
.opt:last-child{border-bottom:none}
.opt:active{background:var(--surface-2)}
.opt strong{display:block;font-size:14px;font-weight:600}
.opt small{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
.opt-h{
  position:sticky;top:0;z-index:1;background:var(--surface-2);
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
  padding:6px 12px;border-bottom:1px solid var(--line);
}
.opt-tengo strong::after{
  content:'EN CASA';font-family:'JetBrains Mono',monospace;font-size:8.5px;
  font-weight:700;letter-spacing:.06em;background:var(--fresh-soft);color:var(--fresh);
  padding:2px 5px;border-radius:4px;margin-left:7px;vertical-align:1px;
}
.opt-new{background:var(--fresh-soft)}
.opt-new strong{color:var(--fresh)}
.combo-vacio{padding:14px 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.pick{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:12px;
}
.pick-l{flex:1;min-width:0}
.pick-l strong{display:block;font-size:14.5px;font-weight:600}
.pick-l small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.pick-x{
  flex:0 0 auto;font-size:12px;font-weight:600;color:var(--fresh);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2);
}
.nuevo{background:var(--fresh-soft);border-radius:11px;padding:11px 12px;margin:-6px 0 12px}
.nuevo>p{
  margin:0 0 9px;font-size:12px;font-weight:600;color:var(--fresh);line-height:1.4;
}
.nuevo label{margin-bottom:0}
.sug{background:var(--warn-soft);border-radius:11px;padding:11px 12px;margin:-6px 0 12px}
.sug p{margin:0 0 8px;font-size:12px;color:var(--warn);font-weight:600;line-height:1.4}
.sug-list{display:flex;flex-direction:column;gap:6px}
.sug-list button{
  display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;text-align:left;font-size:13.5px;font-weight:600;
}
.sug-list button small{font-weight:500;font-size:11px;color:var(--ink-soft);white-space:nowrap}
.sug-no{
  background:none;border:none;padding:0;margin-top:9px;
  font-size:11.5px;color:var(--warn);text-decoration:underline;font-weight:500;
}
.hint{font-size:11.5px;color:var(--ink-soft);margin:-6px 0 12px;line-height:1.45}

.block{
  background:var(--surface);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;
}
.block h3{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;
}
.lote{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);
}
.lote:last-child{border-bottom:none;padding-bottom:0}
.lote:first-of-type{padding-top:0}
.lote-l{min-width:0}
.lote-q{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px}
.lote-d{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.fefo{
  font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.07em;
  background:var(--ink);color:#fff;padding:2px 5px;border-radius:4px;margin-left:6px;
}
.mov{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:none}
.mov span:last-child{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:11.5px;white-space:nowrap}

.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0}
.switch .lbl{margin:0}
.switch small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:400;
  letter-spacing:0;text-transform:none;font-family:'Inter Tight',sans-serif;margin-top:3px}
.tgl{width:44px;height:25px;border-radius:13px;background:var(--line);position:relative;flex:0 0 auto;transition:.2s}
.tgl[aria-checked="true"]{background:var(--fresh)}
.tgl i{position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tgl[aria-checked="true"] i{left:21.5px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.quick button{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 4px;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
}
.quick button:active{background:var(--surface-2)}

/* ---------- Menú semanal ---------- */
.mock{
  background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 11px;
  font-size:11px;font-weight:600;margin:14px 0 10px;line-height:1.4;
}
.chat{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.chat-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.chat-h>span{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);
}
.seg{display:flex;gap:3px;background:var(--surface-2);border-radius:9px;padding:2px}
.seg button{
  padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--ink-soft);
}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.msgs{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.msg{padding:9px 11px;border-radius:11px;font-size:13px;line-height:1.45;max-width:92%}
.msg.user{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.ia{background:var(--surface-2);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
.chips-sug{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chips-sug .chip{font-size:12px;padding:6px 11px}
.dia{background:var(--surface);border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.dia-top{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px}
.dia-l{flex:1;min-width:0}
.dia-d{
  display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;
}
.dia-r{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.dia-m{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.dia-x{font-size:19px;color:var(--ink-faint);width:20px;text-align:center}
.ings{padding:2px 14px 12px;border-top:1px solid var(--line)}
.ing{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:none}
.ing-i{
  width:17px;height:17px;border-radius:50%;flex:0 0 auto;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.i-ok{background:var(--fresh-soft);color:var(--fresh)}
.i-poco{background:var(--warn-soft);color:var(--warn)}
.i-falta{background:var(--urgent-soft);color:var(--urgent)}
.ing-n{flex:1;font-size:13px;font-weight:500;min-width:0}
.ing-q{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft)}
.ing-s{font-size:10.5px;white-space:nowrap}
.s-ok{color:var(--fresh)} .s-poco{color:var(--warn)} .s-falta{color:var(--urgent)}

/* ---------- Lista de compra ---------- */
.buy{
  display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
}
.check{
  width:21px;height:21px;border-radius:6px;border:1.8px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.check svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.buy.done .check{background:var(--fresh);border-color:var(--fresh)}
.buy.done .check svg{opacity:1}
.buy.done .buy-n{text-decoration:line-through;color:var(--ink-faint)}
.buy-l{flex:1;min-width:0}
.buy-n{font-weight:600;font-size:14.5px}
.buy-o{font-size:11px;color:var(--ink-soft);margin-top:2px}
.buy-x{color:var(--ink-faint);font-size:19px;padding:0 3px;line-height:1}
.add-row{display:flex;gap:8px;margin-bottom:14px}
.add-row input{flex:1}
.add-row button{flex:0 0 auto;width:auto;padding:11px 16px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;
  font-size:13px;font-weight:500;max-width:370px;width:calc(100% - 36px);
  box-shadow:0 8px 28px rgba(15,31,27,.3);animation:toastin .25s cubic-bezier(.2,1.2,.4,1);
}
#toast b{font-family:'JetBrains Mono',monospace;font-weight:700}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}}
#toast.out{opacity:0;transition:opacity .25s}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="brand">
      <h1>Invenlux</h1>
      <span class="tag">Sprint 1 · FEFO</span>
    </div>
    <h2 class="view-title" id="vTitle"></h2>
    <p class="view-sub" id="vSub"></p>
  </header>

  <main id="main"></main>

  <button class="fab" id="fab" aria-label="Añadir">+</button>

const UBIC_SUGERIDA = {

/* ---------- Detección de productos duplicados por error de escritura ----------
   Normaliza (minúsculas, sin tildes, sin signos) y compara por distancia de
   edición. "Yogurt natural" y "yogur natural" son el mismo producto. */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

function distancia(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j), cur = new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    [prev,cur] = [cur,prev];
  }
  return prev[n];
}

function parecido(a,b){
  const x = norm(a), y = norm(b);
  if(!x || !y) return 0;
  if(x===y) return 1;

  // "yogur" debe encontrar "Yogur natural": se compara también contra el
  // principio del nombre y contra cada palabra suelta.
  const palabras = y.split(' ');
  if(palabras.some(w => w.startsWith(x) || x.startsWith(w)) && x.length >= 3) return 0.88;

  // Contención sólo si el trozo común es largo: evita que "te" case con
  // "manTEquilla" y devuelva coincidencias absurdas.
  const corto = x.length < y.length ? x : y;
  if(corto.length >= 4 && (x.includes(y) || y.includes(x))) return 0.9;

  return 1 - distancia(x,y)/Math.max(x.length,y.length);
}

const UMBRAL_SUGERENCIA = 0.72;

function similares(nombre){

  const mios = new Set(), cand = [];

    cand.push({valor:'p:'+p.id, nombre:p.nombre,
      detalle: q>0 ? fmtQty(q,p.unidad)+' en casa' : 'sin stock',
      score: parecido(nombre,p.nombre)});
  });
  CATALOGO_PLANO.forEach((c,i) => {
    if(mios.has(norm(c.nombre))) return;
    cand.push({valor:'c:'+i, nombre:c.nombre, detalle:c.categoria,
      score: parecido(nombre,c.nombre)});
  });
  return cand.filter(x => x.score >= UMBRAL_SUGERENCIA)
    .sort((a,b) => b.score - a.score).slice(0,3);
}

const existeIgual = nombre => S.products.find(p => norm(p.nombre) === norm(nombre));

/* Desplegable único: lo que ya tienes en casa + el catálogo de productos
   comunes, agrupado por categoría y alfabético dentro de cada una.
   Un producto creado a mano entra automáticamente en esta lista. */
function filasCatalogo(){
  const mios = new Map(S.products.map(p => [norm(p.nombre), p]));
  const usados = new Set(), filas = [];

  CATALOGO_PLANO.forEach((c,i) => {
    const k = norm(c.nombre), p = mios.get(k);
    if(p){
      usados.add(k);
      filas.push({valor:'p:'+p.id, nombre:p.nombre, categoria:p.categoria,
        stock:stockDe(p.id), unidad:p.unidad});
    } else {
      filas.push({valor:'c:'+i, nombre:c.nombre, categoria:c.categoria});
    }
  });
  // productos que creó el usuario y no están en el catálogo
  S.products.forEach(p => {
    if(usados.has(norm(p.nombre))) return;
    filas.push({valor:'p:'+p.id, nombre:p.nombre, categoria:p.categoria,
      stock:stockDe(p.id), unidad:p.unidad});
  });
  return filas;
}

/* Filtra el catálogo por lo que se va escribiendo. Prioriza: empieza por,
   empieza una palabra por, contiene, y por último tolera erratas. */
function filtrarCatalogo(q){
  const filas = filasCatalogo(), n = norm(q);
  if(!n) return filas;
  return filas
    .map(f => {
      const m = norm(f.nombre);
      let s = 0;
      if(m.startsWith(n)) s = 4;
      else if(m.split(' ').some(w => w.startsWith(n))) s = 3;
      else if(m.includes(n)) s = 2;
      else if(parecido(q, f.nombre) >= UMBRAL_SUGERENCIA) s = 1;
      return {f, s};
    })
    .filter(x => x.s > 0)
    .sort((a,b) => b.s - a.s || a.f.nombre.localeCompare(b.f.nombre,'es'))
    .map(x => x.f);
}

function opcionesProducto(valorSel){
  const filas = filasCatalogo();

    const ps = filas.filter(f => f.categoria===c)
      .sort((a,b) => a.nombre.localeCompare(b.nombre,'es'));
    if(!ps.length) return '';
    return `<optgroup label="${c}">` + ps.map(f => {

      return `<option value="${f.valor}" ${f.valor===valorSel?'selected':''}>${f.nombre}${extra}</option>`;

  }).join('');
}

const lotesDe = pid => S.lotes.filter(l => l.productId===pid && l.cantidad>0);

// HU-05 · orden FEFO: primero lo que antes caduca; sin fecha, al final; empate → entrada más antigua
const fefo = pid => lotesDe(pid).sort((a,b)=>{
  if(a.caducidad && b.caducidad && a.caducidad!==b.caducidad) return a.caducidad < b.caducidad ? -1 : 1;
  if(a.caducidad && !b.caducidad) return -1;
  if(!a.caducidad && b.caducidad) return 1;
  return a.compra < b.compra ? -1 : 1;
});
const proxCad = pid => { const l = fefo(pid)[0]; return l ? l.caducidad : null; };

function estado(dias){
  if(dias===null) return {k:'n',txt:'Sin fecha'};

  if(dias<=S.cfg.aviso) return {k:'w',txt:dias===1?'1 día':dias+' días'};
  return {k:'f',txt:dias+' días'};
}

function aLista(productId, texto, origen){

  S.buy.push({id:id(),texto,productId,origen,comprado:false});

}

  const p = S.products.find(x=>x.id===pid);
  if(!p || !p.autoCompra) return false;
  if(stockDe(pid) <= p.stockMin) return aLista(pid,p.nombre,stockDe(pid)===0?'agotado':'stock mínimo');
  return false;
}

function consumir(pid, cantidad){
  const p = S.products.find(x=>x.id===pid);
  let queda = cantidad, tocados = [];
  for(const l of fefo(pid)){
    if(queda<=0) break;
    const q = Math.min(l.cantidad, queda);
    l.cantidad = +(l.cantidad-q).toFixed(3);
    queda = +(queda-q).toFixed(3);
    tocados.push({lote:l,q});
    S.movs.unshift({id:id(),productId:pid,loteId:l.id,cantidad:q,
      fecha:new Date().toISOString(),caducidad:l.caducidad,ubicacion:l.ubicacion});
  }
  const añadido = revisarStockMin(pid);
  const t = tocados[0];
  if(t){
    const cad = t.lote.caducidad ? `cad. ${t.lote.caducidad.slice(8)}/${t.lote.caducidad.slice(5,7)}` : 'sin fecha';
    toast(`−${fmtQty(cantidad,p.unidad)} de ${p.nombre}. FEFO: descontado del lote de ${t.lote.ubicacion} (<b>${cad}</b>).`
      + (añadido ? ' Añadido a la compra.' : ''));
  }
  render();
}

/* ---------- Signature: horizonte de caducidad ---------- */
function horizonte(){
  const pts = [];
  S.products.forEach(p => lotesDe(p.id).forEach(l => {
    const dl = daysLeft(l.caducidad);
    if(dl!==null && dl<=30) pts.push({dl,k:estado(dl).k,n:p.nombre});
  }));
  const pos = dl => Math.max(0,Math.min(100, ((Math.max(dl,-2)+2)/32)*100));
  const pips = pts.map((x,i)=>
    `<span class="pip ${x.k}" style="left:${pos(x.dl)}%;animation-delay:${i*28}ms" title="${x.n} · ${x.dl}d"></span>`).join('');
  const ticks = [{v:-2,l:'ya'},{v:3,l:'3d'},{v:10,l:'10d'},{v:20,l:'20d'},{v:30,l:'30d'}].map(t=>
    `<span class="tick" style="left:${pos(t.v)}%"><i></i><span>${t.l}</span></span>`).join('');
  const nu = pts.filter(p=>p.k!=='f').length;

  return `<section class="horizon">
    <div class="horizon-head">
      <span>Horizonte de caducidad</span>
      <span>${nu?`<strong>${nu}</strong> por consumir ya`:'Todo bajo control'}</span>
    </div>
    <div class="track"><div class="axis"></div>${ticks}${pips}</div>
    <div class="horizon-legend">
      <div><b style="background:var(--urgent)"></b>Caducado / hoy</div>
      <div><b style="background:var(--warn)"></b>≤ ${S.cfg.aviso} días</div>
      <div><b style="background:var(--fresh)"></b>En plazo</div>
    </div>
  </section>`;
}

/* ============================================================
   MENÚ SEMANAL  ·  Sprint 3 (simulado en local)
   La generación la hará el asistente de IA con las mismas reglas que
   se aplican aquí: aprovechar lo que caduca, equilibrar la semana y
   respetar lo que pida el usuario. Aquí funciona sin red, con un banco
   de recetas local, para poder validar el flujo completo.

/* ---- Cruce de un ingrediente con el inventario ---- */
function estadoIngrediente(nombre, cantidad, unidad){
  const p = S.products.find(x => norm(x.nombre) === norm(nombre))
         || S.products.find(x => parecido(nombre, x.nombre) >= 0.85);
  if(!p) return {k:'falta', txt:'no lo tienes', prod:null};

  const st = stockDe(p.id);
  if(st <= 0) return {k:'falta', txt:'sin stock', prod:p};
  if(p.unidad === unidad && st < cantidad)
    return {k:'poco', txt:`sólo ${fmtQty(st,p.unidad)}`, prod:p};
  return {k:'ok', txt:`${fmtQty(st,p.unidad)} en casa`, prod:p};
}

/* ¿Cuánto ayuda esta receta a gastar lo que está a punto de caducar? */
function urgenciaReceta(r){
  let puntos = 0;
  r.ing.forEach(([nombre]) => {
    const e = estadoIngrediente(nombre, 0, null);
    if(!e.prod || e.k === 'falta') return;
    const dias = daysLeft(proxCad(e.prod.id));
    if(dias === null) return;
    if(dias <= S.cfg.aviso) puntos += 4;
    else if(dias <= 7) puntos += 2;
  });
  return puntos;
}

function faltantesMenu(){
  const vistos = new Set(), faltan = [];
  S.menu.plan.forEach(({receta}) => receta.ing.forEach(([nombre,cant,uni]) => {
    const e = estadoIngrediente(nombre, cant, uni);
    if(e.k === 'ok' || vistos.has(norm(nombre))) return;
    vistos.add(norm(nombre));
    faltan.push({nombre, prod:e.prod, motivo:e.k});
  }));
  return faltan;
}

/* ---- "Interpretación" del texto del chat ---- */
function leerPeticion(texto){
  const t = norm(texto);
  return {
    vegetariano: /(vegetarian|sin carne|sin pescado|verdur)/.test(t),
    rapido:      /(rapid|facil|poco tiempo|sin complicar|15 min|20 min|30 min)/.test(t),
    ligero:      /(liger|sano|saludable|dieta|bajo|adelgaz)/.test(t),
    pescado:     /pescado/.test(t) && !/sin pescado/.test(t),
    horno:       /horno/.test(t),
  };
}

/* ---- Generación del plan ---- */
function generarPlan(texto){
  const f = leerPeticion(texto), n = S.menu.dias;

  const puntuadas = RECETAS
    .filter(r => !f.vegetariano || r.tags.includes('vegetariano'))
    .map(r => {
      let s = urgenciaReceta(r);
      r.ing.forEach(([nombre,cant,uni]) => {
        const e = estadoIngrediente(nombre,cant,uni);
        if(e.k === 'ok') s += 1;
      });
      if(f.rapido)  s += r.tags.includes('rapido') ? 3 : (r.min <= 30 ? 1 : -2);
      if(f.ligero)  s += r.tags.includes('ligero') ? 3 : 0;
      if(f.pescado) s += r.base === 'pescado' ? 3 : 0;
      if(f.horno)   s += r.tags.includes('horno') ? 2 : 0;
      return {r, s};
    })
    .sort((a,b) => b.s - a.s);

  // Equilibrio semanal: sin repetir base dos días seguidos y con tope de carne
  const plan = [], usadas = new Set();
  let carne = 0, previa = null;
  const tope = Math.max(2, Math.round(n * 0.4));

  for(let i = 0; i < n; i++){
    let elegida = puntuadas.find(({r}) =>
      !usadas.has(r.n) && r.base !== previa && !(r.base === 'carne' && carne >= tope));
    if(!elegida) elegida = puntuadas.find(({r}) => !usadas.has(r.n));
    if(!elegida) break;
    usadas.add(elegida.r.n);
    if(elegida.r.base === 'carne') carne++;
    previa = elegida.r.base;
    plan.push({dia:DIAS_SEMANA[i], receta:elegida.r, abierto:false});
  }
  return {plan, filtros:f};
}

function responderChat(texto){
  const {plan, filtros} = generarPlan(texto);
  S.menu.plan = plan;

  const criterios = [];
  if(filtros.vegetariano) criterios.push('sin carne ni pescado');
  if(filtros.rapido)      criterios.push('recetas rápidas');
  if(filtros.ligero)      criterios.push('platos ligeros');
  if(filtros.pescado)     criterios.push('más pescado');
  if(filtros.horno)       criterios.push('al horno');

  const urgentes_ = urgentesEnPlan();
  const faltan = faltantesMenu().length;

  let r = `Menú de ${plan.length} días listo`;
  r += criterios.length ? ` (${criterios.join(', ')}).` : '.';
  const enDespensa = urgentes().map(x => x.p.nombre);
  if(urgentes_.length)
    r += ` He colocado primero lo que caduca pronto: ${urgentes_.join(', ')}.`;
  else if(enDespensa.length){
    const lista = enDespensa.length===1 ? enDespensa[0]
      : enDespensa.slice(0,-1).join(', ') + ' y ' + enDespensa.at(-1);
    r += ` Ojo: ${lista} ${enDespensa.length===1?'caduca':'caducan'} pronto y no ${enDespensa.length===1?'encaja':'encajan'} con lo que me pides.`;
  }
  else
    r += ' No tienes nada a punto de caducar, así que he priorizado lo que ya hay en casa.';
  r += faltan
    ? ` Te faltan ${faltan} ingredientes: puedes mandarlos a la compra de una vez.`
    : ' Tienes todos los ingredientes en casa.';
  return r;
}

function urgentesEnPlan(){
  const nombres = new Set();
  S.menu.plan.forEach(({receta}) => receta.ing.forEach(([nombre]) => {
    const e = estadoIngrediente(nombre, 0, null);
    if(!e.prod || e.k === 'falta') return;
    const dias = daysLeft(proxCad(e.prod.id));
    if(dias !== null && dias <= S.cfg.aviso) nombres.add(e.prod.nombre);
  }));
  return [...nombres];
}

/* ---------- HU-01 + HU-02 · alta unificada de producto y entrada ----------
   Un único paso. El campo de producto es un buscador: al abrirse muestra la
   lista completa (lo que hay en casa + catálogo común) y se va filtrando a
   medida que se escribe. Si nada encaja, se crea el producto desde ahí mismo
   y pasa a formar parte de la lista. */
function sheetEntrada(pidInicial){
  const st = {
    sel:null,            // producto que ya existe en el inventario
    pendiente:null,      // 'catalogo' | 'libre' → producto que se creará al guardar
    filtro:'',           // lo que se está escribiendo en el buscador
    nombre:'', categoria:CATS[0], stockMin:'1', unidad:'unidades', vida:null,
    cantidad:'', ubicacion:'Nevera', compra:d(0), caducidad:'', error:''
  };

  function elegirProducto(pid){
    const p = S.products.find(x => x.id === pid);
    if(!p) return;
    st.sel = p.id; st.pendiente = null; st.nombre = p.nombre;
    st.categoria = p.categoria; st.unidad = p.unidad; st.vida = null;
    st.ubicacion = UBIC_SUGERIDA[p.categoria] || 'Despensa';
    pinta();
  }

  function elegirCatalogo(i){
    const c = CATALOGO_PLANO[i];
    if(!c) return;
    st.sel = null; st.pendiente = 'catalogo'; st.nombre = c.nombre;
    st.categoria = c.categoria; st.unidad = c.unidad; st.vida = c.vida;
    st.ubicacion = UBIC_SUGERIDA[c.categoria] || 'Despensa';
    st.caducidad = c.vida ? d(c.vida) : '';   // caducidad estimada, editable
    pinta();
  }

  function crearLibre(){
    const n = st.filtro.trim();
    if(!n) return;
    st.sel = null; st.pendiente = 'libre'; st.nombre = n;
    st.vida = null; st.caducidad = '';
    pinta();
  }

  const elegirValor = v => v.startsWith('p:') ? elegirProducto(v.slice(2))
                                              : elegirCatalogo(+v.slice(2));

  function volverABuscar(){
    st.sel = null; st.pendiente = null; st.nombre = ''; st.filtro = '';
    st.vida = null; st.caducidad = ''; pinta();
  }

  openSheet(`<h2>Nueva entrada</h2>
    <p class="lead">Busca el producto en la lista. Si no está, puedes crearlo desde el buscador.</p>
    <div id="eBody"></div>`);

  const body = () => document.getElementById('eBody');
  const $ = i => document.getElementById(i);

  /* --- Bloque 1: qué producto es --- */
  function bloqueProducto(){
    if(st.sel){
      const p = S.products.find(x => x.id === st.sel), q = stockDe(p.id);
      return `<span class="lbl">Producto</span>
        <div class="pick">
          <div class="pick-l"><strong>${p.nombre}</strong>
            <small>${p.categoria} · ${q>0 ? fmtQty(q,p.unidad)+' en casa' : 'sin stock ahora'}</small></div>
          <button class="pick-x" data-cambiar="1">Cambiar</button>
        </div>`;
    }

    if(st.pendiente){
      return `<span class="lbl">Producto</span>
        <div class="pick">
          <div class="pick-l"><strong>${st.nombre}</strong>
            <small>${st.pendiente==='catalogo' ? st.categoria+' · primera vez en casa' : 'producto nuevo'}</small></div>
          <button class="pick-x" data-cambiar="1">Cambiar</button>
        </div>` + bloqueNuevo();
    }

    return `<label><span class="lbl">Producto</span>
      <input id="eN" value="${st.filtro.replace(/"/g,'&quot;')}"
        placeholder="Busca o escribe un producto" autocomplete="off"></label>
      <div class="combo" id="eLista"></div>`;
  }

  /* La lista: agrupada por categoría cuando no hay filtro, y ordenada por
     relevancia en cuanto se escribe algo. */
  function pintaLista(){
    const caja = $('eLista');
    if(!caja) return;

    const q = st.filtro.trim();
    const filas = filtrarCatalogo(q);
    let html = '';

    const fila = f => {
      const tengo = f.stock > 0;
      return `<button class="opt ${tengo?'opt-tengo':''}" data-usar="${f.valor}">
        <strong>${f.nombre}</strong>
        <small>${f.categoria}${tengo ? ' · '+fmtQty(f.stock,f.unidad) : ''}</small></button>`;
    };

    if(!q){
      html = [...CATS].sort((a,b)=>a.localeCompare(b,'es')).map(c => {
        const ps = filas.filter(f => f.categoria===c)
          .sort((a,b) => a.nombre.localeCompare(b.nombre,'es'));
        return ps.length ? `<div class="opt-h">${c}</div>` + ps.map(fila).join('') : '';
      }).join('');
    } else {
      html = filas.slice(0,30).map(fila).join('');
      const exacto = filas.some(f => norm(f.nombre) === norm(q));
      if(!exacto){
        html += `<button class="opt opt-new" data-crear="1">
          <strong>Crear «${q}»</strong>
          <small>Se añadirá a tu lista de productos</small></button>`;
      }
      if(!filas.length) html = `<div class="combo-vacio">Nada coincide con «${q}».</div>` + html;
    }

    caja.innerHTML = html;
    caja.querySelectorAll('[data-usar]').forEach(b => b.onclick = () => elegirValor(b.dataset.usar));
    const crear = caja.querySelector('[data-crear]');
    if(crear) crear.onclick = crearLibre;
  }

  /* --- Bloque 2: sólo para productos que aún no existen en casa --- */
  function bloqueNuevo(){
    if(st.sel || !st.pendiente) return '';
    return `<div class="nuevo">
      <p>Primera vez — se creará su ficha al guardar</p>
      <div class="two">
        <label><span class="lbl">Categoría</span>
          <select id="eC">${CATS.map(c=>`<option ${c===st.categoria?'selected':''}>${c}</option>`).join('')}</select></label>
        <label><span class="lbl">Stock mínimo</span>
          <input id="eM" type="number" min="0" step="any" value="${st.stockMin}"></label>
      </div>
    </div>`;
  }

  /* --- Bloque 3: el lote, igual para producto nuevo o existente --- */
  function bloqueLote(){
    const p = st.sel ? S.products.find(x => x.id === st.sel) : null;
    return `<div class="two">
        <label><span class="lbl">Cantidad <em>(${st.unidad})</em></span>
          <input id="eQ" type="number" min="0" step="any" value="${st.cantidad}" placeholder="0"></label>
        <label><span class="lbl">Unidad</span>
          <select id="eU">${UNITS.map(u=>`<option ${u===st.unidad?'selected':''}>${u}</option>`).join('')}</select></label>
      </div>
      ${st.error ? `<p class="err">${st.error}</p>` : ''}
      ${p && st.unidad!==p.unidad
        ? `<p class="hint">Cambiarás la unidad de <strong>${p.nombre}</strong> de ${p.unidad} a ${st.unidad} en toda su ficha.</p>`
        : ''}
      <label><span class="lbl">Ubicación</span>
        <select id="eL">${LOCS.map(l=>`<option ${l===st.ubicacion?'selected':''}>${l}</option>`).join('')}</select></label>
      <div class="two">
        <label><span class="lbl">Fecha de compra</span><input id="eB" type="date" value="${st.compra}"></label>
        <label><span class="lbl">Caducidad</span><input id="eE" type="date" value="${st.caducidad}"></label>
      </div>
      <p class="hint">${st.vida
        ? `Caducidad estimada por vida útil típica (${st.vida} ${st.vida===1?'día':'días'}). Ajústala si el envase indica otra.`
        : 'Puedes dejar la caducidad en blanco: el lote se guarda como "sin fecha".'}</p>
      <button class="btn btn-primary" id="eOk">${st.sel ? 'Guardar entrada' : 'Crear producto y guardar entrada'}</button>`;
  }

  function pinta(){
    body().innerHTML = bloqueProducto() + bloqueLote();
    engancha();
    pintaLista();
  }

  function engancha(){
    const n = $('eN');
    if(n){
      n.oninput = () => { st.filtro = n.value; st.error = ''; pintaLista(); };
      n.onkeydown = e => {
        if(e.key !== 'Enter') return;
        e.preventDefault();
        const primera = $('eLista')?.querySelector('[data-usar],[data-crear]');
        if(primera) primera.click();   // Intro elige el primer resultado
      };
    }

    body().querySelectorAll('[data-cambiar]').forEach(b => b.onclick = volverABuscar);

    const c = $('eC'), m = $('eM');
    if(c) c.onchange = e => {
      st.categoria = e.target.value;
      st.ubicacion = UBIC_SUGERIDA[st.categoria] || 'Despensa';
      pinta();
    };
    if(m) m.oninput = e => st.stockMin = e.target.value;

    if($('eQ')) $('eQ').oninput  = e => { st.cantidad = e.target.value; st.error = ''; };
    if($('eU')) $('eU').onchange = e => { st.unidad = e.target.value; pinta(); };
    if($('eL')) $('eL').onchange = e => st.ubicacion = e.target.value;
    if($('eB')) $('eB').onchange = e => st.compra = e.target.value;
    if($('eE')) $('eE').onchange = e => { st.caducidad = e.target.value; st.vida = null; pinta(); };
    if($('eOk')) $('eOk').onclick = guardar;
  }

  function guardar(){
    if(!st.sel && !st.pendiente){
      st.error = 'Elige un producto de la lista o créalo desde el buscador.';
      pinta(); return;
    }
    const q = parseFloat(String(st.cantidad).replace(',','.'));
    if(!(q>0)){ st.error = 'Indica una cantidad mayor que cero.'; pinta(); return; }

    const esNuevo = !st.sel;
    let p;
    if(esNuevo){
      p = {id:id(), nombre:st.nombre.trim(), categoria:st.categoria, unidad:st.unidad,
           stockMin:parseFloat(String(st.stockMin).replace(',','.'))||0, autoCompra:true};
      S.products.push(p);
    } else {
      p = S.products.find(x => x.id === st.sel);
      if(st.unidad !== p.unidad) p.unidad = st.unidad;   // la unidad es de la ficha, no del lote
    }

    S.lotes.push({id:id(), productId:p.id, cantidad:q, caducidad:st.caducidad||null,
      compra:st.compra||d(0), ubicacion:st.ubicacion});

    // si vuelve a haber stock por encima del mínimo, sale de la lista de la compra
    if(stockDe(p.id) > p.stockMin) S.buy = S.buy.filter(b => b.productId!==p.id || b.comprado);

    closeSheet();
    toast(esNuevo
      ? `${p.nombre} añadido a tu lista de productos con ${fmtQty(q,p.unidad)} en ${st.ubicacion}.`
      : `Entrada guardada: ${fmtQty(q,p.unidad)} de ${p.nombre}.`);
    render();
  }

  if(pidInicial) elegirProducto(pidInicial); else pinta();
}

/* ---------- HU-04 · consumo rápido ---------- */
function sheetConsumo(pid){
  const p = S.products.find(x=>x.id===pid), st = stockDe(pid), u = p.unidad;
  const pasos = u==='unidades' ? [1,2,3,4] : u==='g' ? [50,100,200,500] : u==='kg' ? [0.1,0.25,0.5,1] : [0.1,0.25,0.5,1];
  openSheet(`<h2>${p.nombre}</h2>
    <p class="lead">Quedan ${fmtQty(st,u)} · se descuenta por FEFO</p>
    <div class="quick">${pasos.map(n=>`<button data-q="${n}">−${n}</button>`).join('')}</div>
    <div class="two" style="align-items:end">
      <label style="margin-bottom:10px"><span class="lbl">Otra cantidad</span>
        <input id="cQ" type="number" min="0" step="any" placeholder="0"></label>
      <button class="btn btn-ghost" id="okC" style="margin-bottom:10px">Descontar</button>
    </div>
    <button class="btn btn-danger" id="okE">Se acabó — vaciar y añadir a la compra</button>`);

  sheetEl.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const q = Math.min(parseFloat(b.dataset.q), st);
    closeSheet(); consumir(pid,q);
  });
  document.getElementById('okC').onclick = () => {
    const q = Math.min(parseFloat(document.getElementById('cQ').value)||0, st);
    if(q>0){ closeSheet(); consumir(pid,q); }
  };
  document.getElementById('okE').onclick = () => { closeSheet(); consumir(pid,st); };
}

/* ---------- Quitar del inventario: dos salidas distintas ----------
   "Se acabó" es un consumo real: descuenta el stock por FEFO, queda en el
   histórico y entra en la lista de la compra. "Eliminar" borra la ficha y
   todo su rastro: es para productos creados por error. */
function sheetQuitar(pid){
  const p = S.products.find(x => x.id === pid), st = stockDe(pid);

  openSheet(`<h2>${p.nombre}</h2>
    <p class="lead">Quedan ${fmtQty(st,p.unidad)} · ${p.categoria}</p>
    <div class="block">
      <h3>¿Qué ha pasado?</h3>
      <p class="hint" style="margin:0 0 9px"><strong>Se acabó</strong> — lo has consumido.
        Se descuenta todo el stock por FEFO, queda registrado en el histórico y el
        producto entra en la lista de la compra.</p>
      <p class="hint" style="margin:0"><strong>Eliminar producto</strong> — lo creaste por error
        o ya no lo compras. Se borra la ficha, sus lotes y su histórico. No se puede deshacer.</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="qDel">Eliminar producto</button>
      <button class="btn btn-danger" id="qEnd">Se acabó</button>
    </div>`);

  document.getElementById('qEnd').onclick = () => {
    closeSheet();
    if(st > 0) consumir(pid, st);
    else { revisarStockMin(pid); toast(`${p.nombre} marcado como terminado.`); render(); }
  };

  document.getElementById('qDel').onclick = () => {
    S.lotes = S.lotes.filter(l => l.productId !== pid);
    S.movs  = S.movs.filter(m => m.productId !== pid);
    S.buy   = S.buy.filter(b => b.productId !== pid);
    S.products = S.products.filter(x => x.id !== pid);
    closeSheet(); toast(`${p.nombre} eliminado del inventario.`); render();
  };
}

/* ---------- Detalle de producto (HU-03/05/08) ---------- */
function sheetDetalle(pid){
  const p = S.products.find(x=>x.id===pid), ls = fefo(pid);
  const lotesHtml = ls.map((l,i)=>{
    const dl = daysLeft(l.caducidad), e = estado(dl);
    return `<div class="lote"><div class="lote-l">
      <div class="lote-q">${fmtQty(l.cantidad,p.unidad)}${i===0?'<span class="fefo">SIGUIENTE</span>':''}</div>
      <div class="lote-d">${l.ubicacion} · ${l.caducidad ? 'caduca '+l.caducidad.split('-').reverse().join('/') : 'sin fecha'}</div>
    </div><span class="badge b-${e.k}">${e.txt}</span></div>`;
  }).join('') || '<p class="hint" style="margin:0">Sin stock.</p>';

  const ms = S.movs.filter(m=>m.productId===pid).slice(0,6);
  const movsHtml = ms.length ? ms.map(m=>{
    const t = new Date(m.fecha);
    return `<div class="mov"><span>−${fmtQty(m.cantidad,p.unidad)} · ${m.ubicacion}</span>
      <span>${m.caducidad?'cad '+m.caducidad.slice(8)+'/'+m.caducidad.slice(5,7):'s/f'} · ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span></div>`;
  }).join('') : '<p class="hint" style="margin:0">Todavía no has registrado consumos de este producto.</p>';

  openSheet(`<h2>${p.nombre}</h2>
    <p class="lead">${p.categoria} · ${fmtQty(stockDe(pid),p.unidad)} en total</p>
    <div class="block"><h3>Lotes en orden FEFO</h3>${lotesHtml}</div>
    <div class="block"><h3>Historial de consumo</h3>${movsHtml}</div>
    <div class="block">
      <h3>Reposición</h3>
      <label style="margin-bottom:12px"><span class="lbl">Stock mínimo (${p.unidad})</span>
        <input id="dM" type="number" min="0" step="any" value="${p.stockMin}"></label>
      <div class="switch">
        <div><span class="lbl">Añadir solo a la compra</span>
          <small>Al terminarse o bajar del mínimo, entra en la lista.</small></div>
        <button class="tgl" id="dA" role="switch" aria-checked="${p.autoCompra}"><i></i></button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="dL">Añadir entrada</button>
      <button class="btn btn-primary" id="dC">Registrar consumo</button>
    </div>`);

  document.getElementById('dM').onchange = e => { p.stockMin = parseFloat(e.target.value)||0; render(); };
  document.getElementById('dA').onclick = e => {
    p.autoCompra = !p.autoCompra;
    e.currentTarget.setAttribute('aria-checked', p.autoCompra);
  };
  document.getElementById('dL').onclick = () => sheetEntrada(pid);
  document.getElementById('dC').onclick = () => sheetConsumo(pid);
}

/* ---------- Toast ---------- */
let tTimer;
function toast(html){
  document.getElementById('toast')?.remove();
  const t = document.createElement('div'); t.id='toast'; t.innerHTML=html; t.setAttribute('role','status');
  document.body.appendChild(t);
  clearTimeout(tTimer);
  tTimer = setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),260); },3600);
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => { S.view = b.dataset.nav; render(); });

document.getElementById('fab').onclick = () =>
  S.view==='buy' ? document.getElementById('newBuy')?.focus() : sheetEntrada(null);

main.addEventListener('click', e => {
  const t = e.target.closest('[data-filter],[data-open],[data-eat],[data-quitar],[data-toggle],[data-del],[data-dia],[data-sug],[data-dias],#addBuy,#menuGo,#menuBuy');
  if(!t) return;
  if(t.dataset.filter){ S.filter = t.dataset.filter; render(); }
  else if(t.dataset.open) sheetDetalle(t.dataset.open);
  else if(t.dataset.eat) sheetConsumo(t.dataset.eat);
  else if(t.dataset.quitar) sheetQuitar(t.dataset.quitar);
  else if(t.dataset.dia !== undefined){
    const d = S.menu.plan[+t.dataset.dia]; d.abierto = !d.abierto; render();
  }
  else if(t.dataset.sug){ pedirMenu(t.dataset.sug); }
  else if(t.dataset.dias){ S.menu.dias = +t.dataset.dias; render(); }
  else if(t.id === 'menuGo'){
    const i = document.getElementById('menuIn');
    pedirMenu(i.value.trim() || 'Menú equilibrado para toda la semana');
  }
  else if(t.id === 'menuBuy'){
    const faltan = faltantesMenu();
    let n = 0;
    faltan.forEach(f => { if(aLista(f.prod ? f.prod.id : null, f.nombre, 'menu')) n++; });
    toast(`${n} ${n===1?'ingrediente añadido':'ingredientes añadidos'} a la lista de la compra.`);
    render();
  }
  else if(t.dataset.toggle){
    const b = S.buy.find(x=>x.id===t.dataset.toggle);
    const pasaAComprado = !b.comprado;
    b.comprado = pasaAComprado;
    render();
    // Al marcar como comprado un ítem ligado a un producto ya existente,
    // se abre directo el alta de lote: es el momento natural de decir
    // cuánto, dónde y cuándo caduca, sin tener que ir a buscarlo aparte.
    if(pasaAComprado && b.productId) sheetEntrada(b.productId);
  }
  else if(t.dataset.del){ S.buy = S.buy.filter(x=>x.id!==t.dataset.del); render(); }
  else if(t.id==='addBuy'){
    const i = document.getElementById('newBuy'), v = i.value.trim();
    if(v){ aLista(null,v,'manual'); render(); document.getElementById('newBuy').focus(); }
  }
});
main.addEventListener('keydown', e => {
  if(e.target.id==='newBuy' && e.key==='Enter') document.getElementById('addBuy').click();
  if(e.target.id==='menuIn' && e.key==='Enter') document.getElementById('menuGo').click();
});

/* El asistente: apunta la petición, genera el plan y responde. */
function pedirMenu(texto){
  S.menu.chat = [{rol:'user', texto}];
  S.menu.chat.push({rol:'ia', texto: responderChat(texto)});
  render();
}
main.addEventListener('change', e => {
  if(e.target.id==='cfgAviso'){ S.cfg.aviso = +e.target.value; render(); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
main.addEventListener('scroll', () =>
  document.getElementById('hdr').classList.toggle('scrolled', main.scrollTop>4));

render();
</script>
</body>
</html>
